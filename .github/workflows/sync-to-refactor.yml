name: Sync changes to refactor/v0.2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create sync branch and open PR to refactor/v0.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE_BRANCH="${{ github.ref_name }}"
          TARGET_BRANCH="refactor/v0.2"
          SYNC_BRANCH="sync/${SOURCE_BRANCH}-to-refactor-v0.2"

          echo "Syncing from ${SOURCE_BRANCH} to ${TARGET_BRANCH}..."

          # Fetch the target branch
          git fetch origin "${TARGET_BRANCH}" || {
            echo "Target branch ${TARGET_BRANCH} not found. Skipping sync."
            exit 0
          }

          # Check if there are any differences
          if git diff --quiet "origin/${SOURCE_BRANCH}" "origin/${TARGET_BRANCH}"; then
            echo "No differences between ${SOURCE_BRANCH} and ${TARGET_BRANCH}. Nothing to sync."
            exit 0
          fi

          # Create (or reset) the sync branch from the target
          git checkout -B "${SYNC_BRANCH}" "origin/${TARGET_BRANCH}"

          # Try to merge source into the sync branch
          if git merge --no-ff "origin/${SOURCE_BRANCH}" -m "chore: sync changes from ${SOURCE_BRANCH} to ${TARGET_BRANCH}"; then
            git push origin "${SYNC_BRANCH}" --force

            # Create a PR if one doesn't already exist
            EXISTING_PR=$(gh pr list --base "${TARGET_BRANCH}" --head "${SYNC_BRANCH}" --json number --jq '.[0].number')
            if [ -z "${EXISTING_PR}" ]; then
              PR_BODY="Auto-sync PR: syncing changes from ${SOURCE_BRANCH} into ${TARGET_BRANCH}. Triggered by commit ${{ github.sha }}. Please review and merge if appropriate."
              gh pr create \
                --base "${TARGET_BRANCH}" \
                --head "${SYNC_BRANCH}" \
                --title "chore: sync changes from ${SOURCE_BRANCH} to ${TARGET_BRANCH}" \
                --body "${PR_BODY}" \
                --label "auto-sync"
              echo "Pull request created successfully."
            else
              echo "PR #${EXISTING_PR} already exists for this sync. Updated the branch."
            fi
          else
            echo "Merge conflict detected between ${SOURCE_BRANCH} and ${TARGET_BRANCH}. Manual resolution required."
            git merge --abort
            exit 1
          fi
